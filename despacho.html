<!DOCTYPE html> <!-- Documento HTML5 -->
<html lang="es"> <!-- Idioma del documento -->
<head>
  <meta charset="UTF-8"> <!-- Soporte caracteres latinos -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Responsive -->
  <title>Despacho de Medicamento</title> <!-- Título de la pestaña -->

  <!-- Fuente y estilos globales del proyecto -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">

  <!-- Estilos mínimos específicos de este formulario (mismo patrón del ingreso) -->
  <style>
    /* Tarjeta contenedora del formulario */
    .card { background: var(--white); border: 1px solid var(--gray-200); border-radius: var(--radius); box-shadow: var(--shadow-1); padding: 28px; margin: 28px 0 56px; }
    .card h2 { font-size: 22px; margin-bottom: 6px; }
    .divider { height: 1px; background: var(--gray-200); border: 0; margin: 14px 0 18px; }

    /* Grid de campos (2 columnas en escritorio, 1 en móvil) */
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    @media (max-width: 820px) { .form-grid { grid-template-columns: 1fr; } }

    /* Etiquetas e inputs coherentes con el tema */
    .form-label { font-weight: 500; margin-bottom: 6px; display: block; }
    .form-control {
      width: 100%; height: 44px; padding: 10px 12px;
      border: 1px solid var(--gray-200); border-radius: 10px;
      font-size: 15px; color: var(--blue-900); background: #fff;
      outline: none; transition: border-color .2s ease, box-shadow .2s ease;
    }
    .form-control:focus { border-color: var(--blue-500); box-shadow: 0 0 0 3px rgba(47,111,166,.15); }

    /* Controles de cantidad (+/-) */
    .qty-wrapper { display: flex; align-items: center; gap: 8px; }
    .qty-btn {
      height: 44px; min-width: 44px; border-radius: 10px;
      border: 1px solid var(--gray-200); background: #f8fafc;
      cursor: pointer; font-size: 20px; line-height: 1;
      transition: background .15s ease, transform .05s ease;
    }
    .qty-btn:active { transform: scale(.98); }

    /* Área de botones */
    .actions { margin-top: 18px; display: flex; gap: 12px; justify-content: flex-end; }
    .btn-primary { background: var(--blue-500); color: #fff; border: none; height: 46px; padding: 0 18px; border-radius: 12px; font-weight: 600; cursor: pointer; transition: filter .15s ease, transform .05s ease; }
    .btn-primary:hover { filter: brightness(1.03); }
    .btn-secondary { background: #eef3f8; color: var(--blue-900); border: 1px solid var(--gray-200); }

    /* Autocompletar (lista de sugerencias) */
    .autocomplete-list {
      position: absolute; z-index: 10; width: 100%;
      background: #fff; border: 1px solid var(--gray-200); border-radius: 10px;
      margin-top: 4px; max-height: 220px; overflow: auto; box-shadow: var(--shadow-1);
    }
    .autocomplete-item { padding: 10px 12px; cursor: pointer; font-size: 14px; }
    .autocomplete-item:hover, .autocomplete-item.active { background: #f0f6ff; }
    .relative { position: relative; }

    /* Badge informativa para la unidad detectada */
    .badge {
      display: inline-block; padding: 6px 10px; border-radius: 999px;
      background: #eef3f8; border: 1px solid var(--gray-200); color: var(--blue-900);
      font-size: 13px; margin-top: 6px;
    }
    .hint { color: var(--gray-600); font-size: 13px; margin-top: 6px; }
  </style>
</head>

<body>
  <!-- Encabezado consistente con el resto del sitio -->
  <header class="site-header">
    <div class="container">
      <h1 class="site-title">Despacho de Medicamentos</h1>
      <p class="site-subtitle">Descuenta existencias y registra el responsable</p>
    </div>
  </header>

  <!-- Contenido principal -->
  <main class="container">
    <div class="card">
      <h2>Formulario</h2>
      <hr class="divider">

      <!-- Formulario de despacho -->
      <form id="form-despacho" autocomplete="off">
        <div class="form-grid">
          <!-- Nombre con autocompletar -->
          <div class="relative">
            <label class="form-label" for="medicamento">Nombre del Medicamento</label>
            <input type="text" id="medicamento" name="medicamento" class="form-control" placeholder="Ej: Aconitum Napellus" aria-autocomplete="list" aria-expanded="false" aria-owns="lista-meds" required>
            <div id="lista-meds" class="autocomplete-list" hidden></div>
            <p class="hint">Escribe y elige de la lista. La unidad se detectará automáticamente.</p>
            <!-- Visualización de unidad detectada (solo lectura) -->
            <span id="unidadBadge" class="badge" hidden>Unidad: —</span>
          </div>

          <!-- Presentación -->
          <div>
            <label class="form-label" for="presentacion">Presentación</label>
            <select id="presentacion" name="presentacion" class="form-control" required>
              <option value="" selected disabled>-- Selecciona --</option>
              <option value="globulos">Glóbulos</option>
              <option value="gotas">Gotas</option>
            </select>
          </div>

          <!-- Nivel de dinamización -->
          <div>
            <label class="form-label" for="nivel">Nivel de dinamización</label>
            <input type="number" id="nivel" name="nivel" class="form-control" placeholder="Ej: 30" min="0" step="1" required>
          </div>

          <!-- Cantidad a despachar (con stepper) -->
          <div>
            <label class="form-label" for="cantidad">Cantidad a despachar</label>
            <div class="qty-wrapper">
              <button type="button" class="qty-btn" id="btnRestar">−</button>
              <input type="number" id="cantidad" name="cantidad" class="form-control" min="0" step="1" value="0" inputmode="numeric">
              <button type="button" class="qty-btn" id="btnSumar">+</button>
            </div>
          </div>

          <!-- Usuario que despacha -->
          <div>
            <label class="form-label" for="usuario">Usuario que despacha</label>
            <input type="text" id="usuario" name="usuario" class="form-control" placeholder="Ej: Juan Pérez" required>
          </div>

          <!-- Unidad (campo oculto para envío al backend) -->
          <input type="hidden" id="unidad" name="unidad" value="">
        </div>

        <!-- Acciones -->
        <div class="actions">
          <a class="btn-primary btn-secondary" href="index.html" style="text-decoration:none; display:inline-flex; align-items:center; justify-content:center;">Volver</a>
          <button type="submit" class="btn-primary">Registrar Despacho</button>
        </div>
      </form>
    </div>
  </main>

  <!-- Pie de página -->
  <footer class="site-footer">
    <div class="container">
      <small>© <span id="year"></span> Inventario de Medicamentos</small>
    </div>
  </footer>

  <!-- ===== LÓGICA DEL FORMULARIO (inline para esta etapa) ===== -->
  <script>
    // 1) Año dinámico en el footer
    document.getElementById('year').textContent = new Date().getFullYear();

    // 2) Referencias a elementos del DOM
    const $inputMed   = document.getElementById('medicamento'); // input nombre
    const $listaMeds  = document.getElementById('lista-meds');  // dropdown sugerencias
    const $btnSumar   = document.getElementById('btnSumar');    // botón +
    const $btnRestar  = document.getElementById('btnRestar');   // botón -
    const $cantidad   = document.getElementById('cantidad');    // input cantidad
    const $unidadHid  = document.getElementById('unidad');      // hidden unidad
    const $unidadBadge= document.getElementById('unidadBadge'); // badge visible
    const $form       = document.getElementById('form-despacho');// formulario

    // 3) Lista de medicamentos (se carga desde JSON)
    let MEDICAMENTOS = [];
    fetch('data/medicamentos.json')
      .then(r => r.json())
      .then(list => { MEDICAMENTOS = list; })
      .catch(err => console.error('No se pudo cargar data/medicamentos.json', err));

    // 4) Normalización para coincidencias (ignora acentos y mayúsculas)
    const normalize = (s) => s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');

    // 5) Render de sugerencias según lo que escribe el usuario
    function renderSugerencias(valor) {
      $listaMeds.innerHTML = '';
      if (!valor || !valor.trim()) { $listaMeds.hidden = true; $inputMed.setAttribute('aria-expanded','false'); return; }
      const v = normalize(valor);
      const resultados = MEDICAMENTOS.filter(n => normalize(n).includes(v)).slice(0, 20);
      if (resultados.length === 0) { $listaMeds.hidden = true; $inputMed.setAttribute('aria-expanded','false'); return; }
      resultados.forEach((nombre, i) => {
        const item = document.createElement('div');
        item.className = 'autocomplete-item';
        item.textContent = nombre;
        item.role = 'option';
        if (i === 0) item.classList.add('active');
        item.addEventListener('click', () => selectMedicamento(nombre));
        $listaMeds.appendChild(item);
      });
      $listaMeds.hidden = false;
      $inputMed.setAttribute('aria-expanded','true');
    }

    // 6) Selección de un medicamento desde la lista o al confirmar con Enter
    function selectMedicamento(nombre) {
      $inputMed.value = nombre;
      $listaMeds.hidden = true;
      $inputMed.setAttribute('aria-expanded','false');
        // Intento de “detección local” de la unidad (para pruebas sin backend):
        // Si en el flujo de ingreso guardamos unidad por nombre, la mostramos aquí.
        const unidadGuardada = localStorage.getItem('unidad__' + nombre) || '';
        setUnidadDetectada(unidadGuardada);
    }

    // 7) Muestra visualmente la unidad detectada y la copia al hidden
    function setUnidadDetectada(u) {
      if (u) {
        $unidadHid.value = u;
        $unidadBadge.textContent = 'Unidad: ' + u;
        $unidadBadge.hidden = false;
      } else {
        $unidadHid.value = '';
        $unidadBadge.textContent = 'Unidad: —';
        $unidadBadge.hidden = true;
      }
    }

    // 8) Eventos de autocompletar
    $inputMed.addEventListener('input', (e) => renderSugerencias(e.target.value));
    $inputMed.addEventListener('blur', () => setTimeout(() => { $listaMeds.hidden = true; $inputMed.setAttribute('aria-expanded','false'); }, 120));
    $inputMed.addEventListener('keydown', (e) => {
      const items = Array.from($listaMeds.querySelectorAll('.autocomplete-item'));
      if ($listaMeds.hidden || items.length === 0) return;
      const idx = items.findIndex(it => it.classList.contains('active'));
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        const next = items[Math.min(idx + 1, items.length - 1)];
        items.forEach(it => it.classList.remove('active')); next.classList.add('active'); next.scrollIntoView({ block: 'nearest' });
      }
      if (e.key === 'ArrowUp') {
        e.preventDefault();
        const prev = items[Math.max(idx - 1, 0)];
        items.forEach(it => it.classList.remove('active')); prev.classList.add('active'); prev.scrollIntoView({ block: 'nearest' });
      }
      if (e.key === 'Enter') {
        e.preventDefault();
        if (idx >= 0) selectMedicamento(items[idx].textContent);
      }
    });

    // 9) Stepper de cantidad
    $btnSumar.addEventListener('click', () => { const v = parseInt($cantidad.value || '0', 10); $cantidad.value = (isNaN(v) ? 0 : v) + 1; });
    $btnRestar.addEventListener('click', () => { const v = parseInt($cantidad.value || '0', 10); $cantidad.value = Math.max(0, (isNaN(v) ? 0 : v) - 1); });

    // 10) Envío REAL: registramos el despacho en Google Sheets
    $form.addEventListener('submit', async (e) => {
        e.preventDefault(); // No recargar

        // 10.1) Armamos el objeto con los datos
        const datos = {
        medicamento : $form.medicamento.value.trim(),
        presentacion: $form.presentacion.value,
        nivel       : $form.nivel.value,
        cantidad    : parseInt($form.cantidad.value || '0', 10),
        usuario     : $form.usuario.value.trim(),
        unidad      : $unidadHid.value || localStorage.getItem('unidad__' + $form.medicamento.value.trim()) || "",
        tipo        : "",                 // (opcional) si quieres enviar Tipo aquí también, crea el input y agrega el valor
        accion      : "Despacho"          // ← clave para Apps Script
        };

        // 10.2) Validación mínima
        if (!datos.medicamento || !datos.presentacion || !datos.nivel || !datos.usuario) {
        alert("Completa medicamento, presentación, nivel y usuario.");
        return;
        }

        // 10.3) Deshabilitar botón durante envío
        const btn = $form.querySelector('button[type="submit"]');
        const original = btn.textContent;
        btn.disabled = true;
        btn.textContent = "Enviando…";

        try {
        // 10.4) URL del Apps Script (tu /exec)
        const API_URL = "https://script.google.com/macros/s/AKfycbx1tXfTyvQecBTz95M0Fy7qzKqp50YIv1npKQJibVi8H4bLpTNYc0Y9nfs2gWgsWqzP/exec";

        // 10.5) POST en JSON
const resp = await fetch(API_URL, {
  method: "POST",
  headers: { "Content-Type": "text/plain;charset=utf-8" },
  body: JSON.stringify(datos)
});

        // 10.6) Respuesta
        const res = await resp.json();

        if (res.status === "success") {
            alert("Despacho registrado.\nStock restante: " + res.restante);

            // 10.7) Limpieza rápida
            $form.cantidad.value = '0';
            $form.usuario.value  = '';
            $form.cantidad.focus();
        } else {
            alert("Error del servidor: " + (res.message || "Respuesta inválida"));
        }
        } catch (err) {
        alert("Error de conexión: " + err.message);
        } finally {
        btn.disabled = false;
        btn.textContent = original;
        }
    });

    // 11) NOTA: Durante pruebas, puedes “guardar” la unidad desde ingreso.html así:
    // Cuando registres un ingreso, guarda localmente la unidad con:
    // localStorage.setItem('unidad__' + nombreMedicamento, unidadSeleccionada);
    // Ya lo dejaremos implementado al integrar ambos formularios con el backend.
  </script>
</body>
</html>
