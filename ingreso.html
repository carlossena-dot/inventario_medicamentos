<!DOCTYPE html> <!-- Declaramos documento HTML5 -->
<html lang="es"> <!-- Indicamos idioma español para accesibilidad/SEO -->
<head>
  <meta charset="UTF-8"> <!-- Soporte de caracteres latinos -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Adaptación a móviles -->
  <title>Ingreso de Medicamento</title> <!-- Título de pestaña -->

  <!-- Fuente Google limpia y profesional -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <!-- Nuestra hoja de estilos global (mismo styles.css del paso 1) -->
  <link rel="stylesheet" href="css/styles.css">
  
  <!-- Estilos mínimos específicos del formulario (reutilizaremos en otros HTML) -->
  <style>
    /* Contenedor de la tarjeta/formulario */
    .card {
      background: var(--white);                /* Fondo blanco limpio */
      border: 1px solid var(--gray-200);       /* Borde tenue */
      border-radius: var(--radius);            /* Bordes redondeados consistentes */
      box-shadow: var(--shadow-1);             /* Sombra suave */
      padding: 28px;                           /* Espacio interno cómodo */
      margin: 28px 0 56px;                     /* Separación con otros bloques */
    }
    /* Título dentro de la tarjeta */
    .card h2 {
      font-size: 22px;
      margin-bottom: 6px;
    }
    /* Línea divisoria estilizada */
    .divider {
      height: 1px; background: var(--gray-200); border: 0; margin: 14px 0 18px;
    }
    /* Grid del formulario para alinear inputs en pantallas amplias */
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;          /* Dos columnas en desktop */
      gap: 18px;                               /* Separación entre campos */
    }
    /* En móviles, una sola columna */
    @media (max-width: 820px) { .form-grid { grid-template-columns: 1fr; } }

    /* Etiquetas de los campos */
    .form-label { font-weight: 500; margin-bottom: 6px; display: block; }

    /* Inputs y selects uniformes */
    .form-control {
      width: 100%;
      height: 44px;
      padding: 10px 12px;
      border: 1px solid var(--gray-200);
      border-radius: 10px;
      font-size: 15px;
      color: var(--blue-900);
      background: #fff;
      outline: none;
      transition: border-color .2s ease, box-shadow .2s ease;
    }
    /* Estado focus accesible */
    .form-control:focus {
      border-color: var(--blue-500);
      box-shadow: 0 0 0 3px rgba(47,111,166,.15);
    }

    /* Input con botón + y - a los lados (stepper) */
    .qty-wrapper {
      display: flex; align-items: center; gap: 8px;
    }
    .qty-btn {
      height: 44px; min-width: 44px; border-radius: 10px; border: 1px solid var(--gray-200);
      background: #f8fafc; cursor: pointer; font-size: 20px; line-height: 1; 
      transition: background .15s ease, transform .05s ease;
    }
    .qty-btn:active { transform: scale(.98); }
    .actions {
      margin-top: 18px; display: flex; gap: 12px; justify-content: flex-end;
    }
    .btn-primary {
      background: var(--blue-500); color: #fff; border: none;
      height: 46px; padding: 0 18px; border-radius: 12px; font-weight: 600; cursor: pointer;
      transition: filter .15s ease, transform .05s ease;
    }
    .btn-primary:hover { filter: brightness(1.03); }
    .btn-secondary { background: #eef3f8; color: var(--blue-900); border: 1px solid var(--gray-200); }
    .hint { color: var(--gray-600); font-size: 13px; margin-top: 6px; }

    /* Dropdown de autocompletar (ligero y accesible) */
    .autocomplete-list {
      position: absolute; z-index: 10; width: 100%;
      background: #fff; border: 1px solid var(--gray-200); border-radius: 10px;
      margin-top: 4px; max-height: 220px; overflow: auto; box-shadow: var(--shadow-1);
    }
    .autocomplete-item {
      padding: 10px 12px; cursor: pointer; font-size: 14px;
    }
    .autocomplete-item:hover, .autocomplete-item.active { background: #f0f6ff; }
    .relative { position: relative; } /* Ayuda a posicionar el dropdown */
  </style>
</head>

<body>
  <!-- Encabezado consistente con el index -->
  <header class="site-header">
    <div class="container">
      <h1 class="site-title">Ingreso de Medicamentos</h1>
      <p class="site-subtitle">Registra nuevas existencias en inventario</p>
    </div>
  </header>

  <!-- Contenido principal -->
  <main class="container">
    <div class="card">
      <h2>Formulario</h2>
      <hr class="divider">

      <!-- FORMULARIO: agrupamos campos en un <form> para poder validar/enviar -->
      <form id="form-ingreso" autocomplete="off">
        <!-- Grid de 2 columnas -->
        <div class="form-grid">

          <!-- Campo: Nombre del medicamento con AUTOCOMPLETAR -->
          <div class="relative"> <!-- relative para ubicar la lista debajo -->
            <label class="form-label" for="medicamento">Nombre del Medicamento</label>
            <input
              type="text"                 
              id="medicamento"            
              name="medicamento"          
              class="form-control"        
              placeholder="Ej: Aconitum Napellus"  
              aria-autocomplete="list"    
              aria-expanded="false"       
              aria-owns="lista-meds"      
              required>                    
            <!-- Contenedor donde aparecerán las coincidencias -->
            <div id="lista-meds" class="autocomplete-list" hidden></div>
            <p class="hint">Empieza a escribir y elige de la lista (se sugiere por coincidencia).</p>
          </div>

          <!-- Campo: Presentación (select) -->
          <div>
            <label class="form-label" for="presentacion">Presentación</label>
            <select id="presentacion" name="presentacion" class="form-control" required>
              <option value="" selected disabled>-- Selecciona --</option>
              <option value="globulos">Glóbulos</option>
              <option value="gotas">Gotas</option>
            </select>
          </div>

          <!-- Campo: Nivel de dinamización -->
          <div>
            <label class="form-label" for="nivel">Nivel de dinamización</label>
            <input type="number" id="nivel" name="nivel" class="form-control" placeholder="Ej: 30" min="0" step="1" required>
          </div>

          <!-- Campo: Tipo de dinamización -->
          <div>
            <label class="form-label" for="tipo">Tipo de dinamización</label>
            <input type="text" id="tipo" name="tipo" class="form-control" placeholder="Ej: CH" maxlength="10" required>
          </div>

          <!-- Campo: Cantidad con stepper (+/-) -->
          <div>
            <label class="form-label" for="cantidad">Cantidad a ingresar</label>
            <div class="qty-wrapper">
              <button type="button" class="qty-btn" id="btnRestar" aria-label="Disminuir cantidad">−</button>
              <input type="number" id="cantidad" name="cantidad" class="form-control" min="0" step="1" value="0" inputmode="numeric">
              <button type="button" class="qty-btn" id="btnSumar" aria-label="Aumentar cantidad">+</button>
            </div>
          </div>

          <!-- Campo: Unidad (select) -->
          <div>
            <label class="form-label" for="unidad">Unidad</label>
            <select id="unidad" name="unidad" class="form-control" required>
              <option value="" selected disabled>-- Selecciona --</option>
              <option value="gr">gr</option>
              <option value="ml">ml</option>
              <option value="unidades">unidades</option>
            </select>
          </div>

        </div> <!-- /form-grid -->

        <!-- Botones de acción: Volver y Registrar -->
        <div class="actions">
          <!-- Volver a la portada -->
          <a class="btn-primary btn-secondary" href="index.html" style="text-decoration:none; display:inline-flex; align-items:center; justify-content:center;">Volver</a>
          <!-- Botón principal: por ahora evitamos envío real; JS lo manejará luego -->
          <button type="submit" class="btn-primary">Registrar Ingreso</button>
        </div>
      </form>
    </div>
  </main>

  <!-- Pie de página consistente -->
  <footer class="site-footer">
    <div class="container">
      <small>© <span id="year"></span> Inventario de Medicamentos</small>
    </div>
  </footer>

  <!-- ==== LÓGICA DEL FORMULARIO (temporal dentro de este archivo) ==== -->
  <script>
    // 1) Año dinámico en el footer.
    document.getElementById('year').textContent = new Date().getFullYear();

    // 2) Referencias a elementos del DOM que usaremos varias veces.
    const $inputMed   = document.getElementById('medicamento'); // input de texto
    const $listaMeds  = document.getElementById('lista-meds');  // contenedor de sugerencias
    const $btnSumar   = document.getElementById('btnSumar');    // botón +
    const $btnRestar  = document.getElementById('btnRestar');   // botón -
    const $cantidad   = document.getElementById('cantidad');    // input numérico de cantidad
    const $form       = document.getElementById('form-ingreso');// formulario

    // 3) Cache local de medicamentos (se llenará leyendo el JSON).
    let MEDICAMENTOS = [];

    // 4) Cargar el JSON con la lista de medicamentos (data/medicamentos.json).
    //    Usamos fetch para traerlo; si hay un error, lo mostramos en consola.
    fetch('data/medicamentos.json')
      .then(res => res.json())
      .then(data => { MEDICAMENTOS = data; })
      .catch(err => { 
        console.error('No se pudo cargar data/medicamentos.json', err);
      });

    // 5) Utilidad: filtra coincidencias ignorando acentos/mayúsculas.
    //    Normalizamos cadenas para comparar de forma más flexible.
    const normalize = (str) => str
      .toLowerCase()
      .normalize('NFD')              // separa caracteres y diacríticos
      .replace(/[\u0300-\u036f]/g,''); // elimina diacríticos (acentos)

    // 6) Mostrar lista de sugerencias bajo el input según el texto tipeado.
    function renderSugerencias(valor) {
      // Limpiamos el contenedor antes de volver a llenarlo.
      $listaMeds.innerHTML = '';

      // Si está vacío, ocultamos la lista y salimos.
      if (!valor || valor.trim().length === 0) { 
        $listaMeds.hidden = true;
        $inputMed.setAttribute('aria-expanded','false');
        return;
      }

      // Tomamos hasta 20 coincidencias que contengan el valor ingresado.
      const v = normalize(valor);
      const resultados = MEDICAMENTOS
        .filter(nombre => normalize(nombre).includes(v))
        .slice(0, 20);

      // Si no hay coincidencias, ocultamos la lista.
      if (resultados.length === 0) {
        $listaMeds.hidden = true;
        $inputMed.setAttribute('aria-expanded','false');
        return;
      }

      // Creamos un div por cada coincidencia y lo agregamos al contenedor.
      resultados.forEach((nombre, idx) => {
        const item = document.createElement('div');
        item.className = 'autocomplete-item';
        item.textContent = nombre;
        item.role = 'option';
        if (idx === 0) item.classList.add('active'); // la primera opción por defecto
        // Al hacer clic, ponemos el texto en el input y cerramos la lista.
        item.addEventListener('click', () => {
          $inputMed.value = nombre;
          $listaMeds.hidden = true;
          $inputMed.setAttribute('aria-expanded','false');
        });
        $listaMeds.appendChild(item);
      });

      // Mostramos la lista y marcamos aria-expanded=true para accesibilidad.
      $listaMeds.hidden = false;
      $inputMed.setAttribute('aria-expanded','true');
    }

    // 7) Escuchamos lo que el usuario escribe y renderizamos coincidencias.
    $inputMed.addEventListener('input', (e) => {
      renderSugerencias(e.target.value);
    });

    // 8) Cerrar la lista si el input pierde foco (con un pequeño delay para permitir clic).
    $inputMed.addEventListener('blur', () => {
      setTimeout(() => { $listaMeds.hidden = true; $inputMed.setAttribute('aria-expanded','false'); }, 120);
    });

    // 9) Permitir seleccionar con teclas (↑/↓/Enter) dentro del dropdown.
    $inputMed.addEventListener('keydown', (e) => {
      const items = Array.from($listaMeds.querySelectorAll('.autocomplete-item'));
      if ($listaMeds.hidden || items.length === 0) return;

      const idx = items.findIndex(it => it.classList.contains('active'));
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        const next = items[Math.min(idx + 1, items.length - 1)];
        items.forEach(it => it.classList.remove('active'));
        next.classList.add('active');
        next.scrollIntoView({ block: 'nearest' });
      }
      if (e.key === 'ArrowUp') {
        e.preventDefault();
        const prev = items[Math.max(idx - 1, 0)];
        items.forEach(it => it.classList.remove('active'));
        prev.classList.add('active');
        prev.scrollIntoView({ block: 'nearest' });
      }
      if (e.key === 'Enter') {
        e.preventDefault();
        if (idx >= 0) {
          $inputMed.value = items[idx].textContent;
          $listaMeds.hidden = true;
          $inputMed.setAttribute('aria-expanded','false');
        }
      }
    });

    // 10) Lógica del stepper (+/-) para la cantidad.
    $btnSumar.addEventListener('click', () => {
      const val = parseInt($cantidad.value || '0', 10);
      $cantidad.value = (isNaN(val) ? 0 : val) + 1; // aumenta en 1
    });
    $btnRestar.addEventListener('click', () => {
      const val = parseInt($cantidad.value || '0', 10);
      const nuevo = (isNaN(val) ? 0 : val) - 1;
      $cantidad.value = Math.max(0, nuevo); // no bajamos de 0
    });

    // 11) Envío REAL: guardamos en Google Sheets vía Apps Script
    $form.addEventListener('submit', async (e) => {
        e.preventDefault(); // Evita recargar la página

        // 11.1) Armamos el objeto con los datos del formulario
        const datos = {
        medicamento : $form.medicamento.value.trim(),
        presentacion: $form.presentacion.value,
        nivel       : $form.nivel.value,
        tipo        : $form.tipo.value.trim().toUpperCase(),
        cantidad    : parseInt($form.cantidad.value || '0', 10),
        unidad      : $form.unidad.value,
        accion      : "Ingreso",            // ← importante para Apps Script
        usuario     : "-"                   // ← si luego quieres registrar quién ingresa, cámbialo aquí
        };

        // 11.2) Validación mínima
        if (!datos.medicamento || !datos.presentacion || !datos.tipo || !datos.unidad) {
        alert("Por favor completa todos los campos obligatorios.");
        return;
        }

        // 11.3) Deshabilitamos el botón mientras se envía (UX)
        const btn = $form.querySelector('button[type="submit"]');
        const original = btn.textContent;
        btn.disabled = true;
        btn.textContent = "Enviando…";

        try {
        // 11.4) URL del Apps Script (tu /exec)
        const API_URL = "https://script.google.com/macros/s/AKfycbx1tXfTyvQecBTz95M0Fy7qzKqp50YIv1npKQJibVi8H4bLpTNYc0Y9nfs2gWgsWqzP/exec";

        // 11.5) Hacemos POST en JSON
        const resp = await fetch(API_URL, {
        method: "POST",
        // Importante: usar text/plain para evitar preflight CORS
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(datos)
        });

        // 11.6) Leemos respuesta como JSON
        
        const res = await resp.json();

        if (res.status === "success") {
            // 11.7) Guardamos la unidad localmente (para que Despacho la detecte de inmediato)
            localStorage.setItem('unidad__' + datos.medicamento, datos.unidad);

            // 11.8) Feedback al usuario
            alert("Ingreso registrado correctamente.\nStock restante: " + res.restante);

            // 11.9) Limpieza ligera para seguir cargando
            $form.cantidad.value = '0';
            $form.cantidad.focus();
        } else {
            alert("Error del servidor: " + (res.message || "Respuesta inválida"));
        }
        } catch (err) {
        alert("Error de conexión: " + err.message);
        } finally {
        // 11.10) Restauramos el botón
        btn.disabled = false;
        btn.textContent = original;
        }
    });
  </script>
</body>
</html>
